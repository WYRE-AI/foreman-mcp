services:
  foreman-mcp:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - MCP_TRANSPORT=http
      - MCP_HTTP_PORT=8080
      - MCP_HTTP_HOST=0.0.0.0
      - AUTH_MODE=gateway
      - FOREMAN_USERNAME=${FOREMAN_USERNAME:?set FOREMAN_USERNAME}
      - FOREMAN_TOKEN=${FOREMAN_TOKEN:?set FOREMAN_TOKEN}
      - FOREMAN_CA_CERT_FILE=${FOREMAN_CA_CERT_FILE:-}
      - CONDUIT_S2S_SECRET=${CONDUIT_S2S_SECRET:?set CONDUIT_S2S_SECRET}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
