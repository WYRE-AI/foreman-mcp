services:
  foreman-mcp:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - MCP_TRANSPORT=http
      - MCP_HTTP_PORT=8080
      - MCP_HTTP_HOST=0.0.0.0
      # Gateway mode: credentials arrive per request in X-Foreman-Username / X-Foreman-Token.
      - AUTH_MODE=gateway
      - FOREMAN_BASE_URL=${FOREMAN_BASE_URL:?set FOREMAN_BASE_URL}
      - CONDUIT_S2S_SECRET=${CONDUIT_S2S_SECRET:?set CONDUIT_S2S_SECRET}
      # Extra Host header values the gateway uses to reach this container (no ports).
      # - MCP_ALLOWED_HOSTS=foreman-mcp
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
